<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medison's Narrative — Song of the Year 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #1a0b2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }

  /* מסגרת הפורטרט עם הרקע המעוצב — ממלאת את גובה המסך */
  .frame {
    position: relative;
    width: min(100vw - 24px, (100vh - 24px) * 338 / 600);
    aspect-ratio: 338 / 600;
    background-image: url("background.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
  }

  /* אזור התוכן בתוך ה"חלון" הריק שבמרכז הרקע */
  .content {
    position: absolute;
    top: 31%;
    left: 8%;
    right: 8%;
    bottom: 9%;
    display: flex;
    flex-direction: column;
    gap: 2%;
    padding: 2px;
  }

  /* רשימת ששת המלבנים */
  .song-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 2.1%;
    overflow-y: auto;
  }

  /* כפתור send ורוד-פוקסיה מהבהב, מתחת לששת המלבנים */
  .send-btn {
    flex: 0 0 auto;
    align-self: center;
    border: none;
    border-radius: 12px;
    padding: 11px 34px;
    color: #fff;
    font-size: clamp(15px, 4.8vw, 21px);
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    background: #ff1aa8;
    animation: blink 1s ease-in-out infinite;
  }
  .send-btn:disabled { animation: none; opacity: .6; cursor: default; }
  @keyframes blink {
    0%, 100% { background: #ff1aa8; box-shadow: 0 0 0 0 rgba(255,26,168,.5); transform: scale(1); }
    50%      { background: #ff5ec8; box-shadow: 0 0 9px 1px rgba(255,26,168,.65); transform: scale(1.015); }
  }

  /* שורה: מלבן לבן + תיבת דירוג לצדו */
  .song-row {
    display: flex;
    direction: ltr;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-height: 0;
  }

  /* מלבן שיר לבן */
  .song {
    display: flex;
    direction: ltr;
    align-items: center;
    background: #ffffff;
    border-radius: 12px;
    padding: 6px 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    flex: 1;
    height: 100%;
    min-height: 0;
    gap: 8px;
    transition: transform .15s, box-shadow .15s;
  }
  .song.playing {
    box-shadow: 0 0 0 3px #ffd84d, 0 4px 14px rgba(0,0,0,.3);
    transform: scale(1.015);
  }

  .song-name {
    flex: 1;
    font-weight: 700;
    font-size: clamp(12px, 3.4vw, 16px);
    color: #2a1840;
    line-height: 1.15;
    text-align: left;
    direction: ltr;
    unicode-bidi: plaintext;
    padding-left: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* תיבת הדירוג — לצד המלבן */
  .rate {
    flex: 0 0 auto;
    font-size: clamp(14px, 4vw, 17px);
    font-weight: 800;
    color: #2a1840;
    background: #fff;
    border: 2px solid #b9a3e3;
    border-radius: 9px;
    padding: 6px 4px;
    text-align: center;
    cursor: pointer;
    width: 46px;
  }
  .rate.dup { border-color: #e23a3a; background: #ffe2e2; }

  /* אייקון רמקול = כפתור נגינה, בדופן הימני */
  .speaker {
    flex: 0 0 auto;
    width: clamp(34px, 9vw, 44px);
    height: clamp(34px, 9vw, 44px);
    background: url("ramkol.png") center/contain no-repeat;
    cursor: pointer;
    border: none;
    background-color: transparent;
    transition: transform .12s;
  }
  .speaker:hover { transform: scale(1.12); }
  .song.playing .speaker { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.18); }
  }

  /* כפתור VOTE NOW — ממוקם מעל הכפתור שמצויר ברקע בתחתית */
  .vote-btn {
    position: absolute;
    bottom: 3.2%;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 6.5%;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 30px;
  }
  .vote-btn:active { background: rgba(255,255,255,.18); }

  /* הודעת אזהרה */
  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #e23a3a;
    color: #fff;
    padding: 11px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.ok { background: #2ca85a; }

  .vote-btn:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>

  <div class="page">
    <div class="frame">
      <div class="content">
        <div class="song-list" id="songList"></div>
        <button class="send-btn" id="sendBtn">send</button>
      </div>
      <button class="vote-btn" id="voteBtn" title="VOTE NOW" aria-label="VOTE NOW"></button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- רשימת השירים: שם תצוגה + נתיב הקובץ ----
  const SONGS = [
    { name: "Global DNA",            file: "Global DNA.mp3" },
    { name: "The 4th Territory",     file: "The 4th territory.mp3" },
    { name: "The Access Revolution", file: "The access revolution.mp3" },
    { name: "The Art of Partnership",file: "The art of partnership.mp3" },
    { name: "The Human Elements",    file: "The human elements.mp3" },
    { name: "The Visionary",         file: "The visionary.mp3" },
  ];

  // ---- נגן יחיד ----
  let audio = null;
  let playingIndex = -1;

  function stopAudio() {
    if (audio) { audio.pause(); audio.currentTime = 0; }
    if (playingIndex >= 0) {
      const el = document.querySelector('.song[data-i="' + playingIndex + '"]');
      if (el) el.classList.remove("playing");
    }
    playingIndex = -1;
  }

  function togglePlay(i) {
    if (playingIndex === i) { stopAudio(); return; }
    stopAudio();
    audio = new Audio(SONGS[i].file);
    audio.play().catch(() => showToast("לא ניתן לנגן את הקובץ: " + SONGS[i].file));
    playingIndex = i;
    const el = document.querySelector('.song[data-i="' + i + '"]');
    if (el) el.classList.add("playing");
    audio.onended = () => stopAudio();
  }

  // ---- בניית רשימת השירים ----
  const songList = document.getElementById("songList");
  SONGS.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "song-row";

    const box = document.createElement("div");
    box.className = "song";
    box.dataset.i = i;

    const speaker = document.createElement("button");
    speaker.className = "speaker";
    speaker.title = "נגן/עצור: " + s.name;
    speaker.setAttribute("aria-label", "נגן " + s.name);
    speaker.addEventListener("click", () => togglePlay(i));

    const nameEl = document.createElement("div");
    nameEl.className = "song-name";
    nameEl.textContent = s.name;

    // בתוך המלבן (LTR): שם השיר משמאל, רמקול בדופן הימני
    box.appendChild(nameEl);
    box.appendChild(speaker);

    const sel = document.createElement("select");
    sel.className = "rate";
    sel.dataset.i = i;
    sel.innerHTML = '<option value="">–</option>' +
      [1,2,3,4,5,6].map(n => '<option value="' + n + '">' + n + '</option>').join("");
    sel.addEventListener("change", clearDupMarks);

    // השורה: תיבת הדירוג בצד שמאל, ולצדה המלבן הלבן
    row.appendChild(sel);
    row.appendChild(box);
    songList.appendChild(row);
  });

  function getSelects() {
    return Array.from(document.querySelectorAll("select.rate"));
  }
  function clearDupMarks() {
    getSelects().forEach(s => s.classList.remove("dup"));
  }

  // ---- הודעות ----
  let toastTimer = null;
  function showToast(msg, ok) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.toggle("ok", !!ok);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
  }

  // ---- חיבור ל-Supabase ----
  const SUPABASE_URL = "https://rksggqzyzpxcqfazcazu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Yx87fcJydHtZco7DB3kk3A_rINMGjIn";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // עמודות הטבלה לפי סדר השירים ב-SONGS
  const COLUMNS = [
    "global_dna",
    "the_4th_territory",
    "the_access_revolution",
    "the_art_of_partnership",
    "the_human_elements",
    "the_visionary",
  ];

  // ---- הצבעה ----
  const voteBtn = document.getElementById("voteBtn");
  const sendBtn = document.getElementById("sendBtn");

  async function submitVote() {
    const selects = getSelects();
    const values = selects.map(s => s.value);

    // ולידציה: כל השירים דורגו
    if (values.some(v => v === "")) {
      showToast("יש לדרג את כל ששת השירים לפני השליחה");
      return;
    }
    // ולידציה: ערכים ייחודיים
    const seen = {};
    let dup = false;
    values.forEach((v, idx) => {
      if (seen[v] !== undefined) { dup = true; selects[idx].classList.add("dup"); selects[seen[v]].classList.add("dup"); }
      else seen[v] = idx;
    });
    if (dup) {
      showToast("כל מספר 1–6 יכול לשמש פעם אחת בלבד");
      return;
    }

    // שמירת ההצבעה ל-Supabase
    const row = {};
    COLUMNS.forEach((c, i) => { row[c] = Number(values[i]); });

    voteBtn.disabled = true;
    sendBtn.disabled = true;
    try {
      const { error } = await db.from("votes").insert(row);
      if (error) throw error;

      // איפוס הטופס למשתתף הבא
      selects.forEach(s => { s.value = ""; });
      clearDupMarks();
      stopAudio();
      showToast("Your vote has been submitted! Thank you 🎉", true);
    } catch (e) {
      showToast("שגיאה בשמירת ההצבעה. נסו שוב.");
      console.error(e);
    } finally {
      voteBtn.disabled = false;
      sendBtn.disabled = false;
    }
  }

  voteBtn.addEventListener("click", submitVote);
  sendBtn.addEventListener("click", submitVote);
</script>
</body>
</html>
